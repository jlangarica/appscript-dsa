<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    /* DSA Institutional Palette */
    --dsa-primary: #1A365D; /* Azul Marino Institucional */
    --dsa-accent: #C5A059;  /* Dorado Institucional */
    --system-blue: var(--dsa-primary); 
    
    /* Apple System Colors - Light Mode */
    --system-gray: #8e8e93;
    --system-gray2: #aeaeb2;
    --system-gray3: #c7c7cc;
    --system-gray4: #d1d1d6;
    --system-gray5: #e5e5ea;
    --system-gray6: #f2f2f7;
    --system-green: #34c759;
    --system-red: #ff3b30;
    --system-orange: #ff9500;
    --system-indigo: #5856d6;
    
    --bg-color: #ffffff;
    --card-bg: rgba(255, 255, 255, 0.9);
    --sidebar-bg: rgba(248, 248, 249, 0.85);
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --separator: rgba(0, 0, 0, 0.1);
    --sidebar-width: 220px;
    --sidebar-collapsed-width: 72px;
    --active-pill: rgba(0, 122, 255, 0.1);
    --active-text: #007aff;
    --table-head-bg: rgba(0, 0, 0, 0.03);

    /* --- APPLE VIBRANCY SYSTEM --- */
    --glass-sidebar: blur(40px) saturate(180%);
    --glass-card: blur(20px) saturate(160%);
    --glass-overlay: blur(60px) saturate(210%);

    /* --- ELEVATION SYSTEM --- */
    --shadow-xs: 0 1px 3px rgba(0,0,0,0.04);       /* Input, chip */
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.06);       /* Card base */
    --shadow-md: 0 8px 30px rgba(0,0,0,0.08);       /* Card hover, dropdown */
    --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);      /* Modal, panel */
    --shadow-xl: 0 30px 80px rgba(0,0,0,0.18);      /* Command palette */

    /* --- ELITE TYPOGRAPHY TOKENS --- */
    --font-xs: 0.6875rem;    /* 11px — labels, badges */
    --font-sm: 0.8125rem;    /* 13px — body secundario */
    --font-base: 0.9375rem;  /* 15px — body principal */
    --font-md: 1.0625rem;    /* 17px — subtítulos */
    --font-lg: 1.375rem;     /* 22px — títulos de vista */
    --font-xl: 1.75rem;      /* 28px — números de stats */

    --leading-tight: 1.2;
    --leading-normal: 1.5;
    --leading-relaxed: 1.65;

    --tracking-tight: -0.02em;
    --tracking-normal: -0.011em;
    --tracking-wide: 0.05em;
  }

  [data-theme="dark"] {
    --bg-color: #000000;
    --card-bg: rgba(28, 28, 30, 0.8);
    --sidebar-bg: rgba(28, 28, 30, 0.85);
    --text-primary: #f5f5f7;
    --text-secondary: #86868b;
    --separator: rgba(255, 255, 255, 0.1);
    --active-pill: rgba(255, 255, 255, 0.15);
    --active-text: #ffffff;
    --table-head-bg: rgba(255, 255, 255, 0.05);
  }

  /* --- GLASSMORPHISM TOPBAR --- */
  .dsa-topbar {
    position: sticky;
    top: 0;
    z-index: 900;
    background: rgba(var(--bg-color-rgb), 0.7);
    backdrop-filter: var(--glass-card);
    -webkit-backdrop-filter: var(--glass-card);
    border-bottom: 1px solid var(--separator);
    margin-bottom: 2rem;
    transition: background 0.3s;
    view-transition-name: topbar;
  }
  
  :root { --bg-color-rgb: 255, 255, 255; }
  [data-theme="dark"] { --bg-color-rgb: 0, 0, 0; }

  /* ✅ View transitions por nombre para morphing real */
  #v-dashboard { view-transition-name: dashboard; }
  #v-registro { view-transition-name: registro; }
  #v-archivo { view-transition-name: archivo; }

  .dsa-sidebar { view-transition-name: sidebar; }

  .avatar-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--font-xs);
    font-weight: 600;
    box-shadow: var(--shadow-xs);
  }

  /* Scrollbars estilo Apple */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: transparent; 
  }
  ::-webkit-scrollbar-thumb {
    background-color: var(--system-gray4); 
    border-radius: 10px;
    border: 2px solid var(--bg-color);
  }
  [data-theme="dark"] ::-webkit-scrollbar-thumb {
    background-color: var(--system-gray2);
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: var(--system-gray);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", sans-serif;
    font-size: var(--font-base);
    line-height: var(--leading-normal);
    letter-spacing: var(--tracking-normal);
    background-color: var(--bg-color);
    color: var(--text-primary);
    overflow-x: hidden;
    transition: background 0.3s ease;
  }

  /* --- SIDEBAR MAC OS STYLE --- */
  .dsa-sidebar {
    width: var(--sidebar-width);
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    background: var(--sidebar-bg);
    backdrop-filter: var(--glass-sidebar);
    -webkit-backdrop-filter: var(--glass-sidebar);
    border-right: 1px solid var(--separator);
    padding: 1.5rem 0.75rem;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
  }

  .dsa-sidebar.collapsed {
    width: var(--sidebar-collapsed-width);
    padding: 1.5rem 0.5rem;
  }

  .sidebar-brand {
    padding: 0 0.75rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    text-align: center;
  }

  .sidebar-brand img {
    box-shadow: var(--shadow-md);
    border: 0.5px solid var(--separator);
  }

  .sidebar-brand span {
    font-weight: 600;
    font-size: var(--font-sm);
    color: var(--text-primary);
    opacity: 0.9;
    letter-spacing: var(--tracking-tight);
  }

  .nav-group-title {
    font-size: var(--font-xs);
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    margin: 1.75rem 0.75rem 0.5rem;
    padding-top: 0.75rem;
    position: relative;
  }

  .nav-group-title:not(:first-of-type)::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0.75rem;
    right: 0.75rem;
    height: 1px;
    background: var(--separator);
  }

  .dsa-nav-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 0.85rem;
    border-radius: 8px;
    color: var(--text-primary);
    text-decoration: none !important;
    font-size: var(--font-sm);
    font-weight: 400;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    margin-bottom: 2px;
    position: relative;
    z-index: 1;
    will-change: transform, opacity;
  }

  .dsa-nav-link i {
    font-size: 1rem;
    color: var(--system-blue);
    width: 20px;
    text-align: center;
  }

  .dsa-nav-link:hover {
    background: var(--active-pill);
  }

  .dsa-nav-link.active {
    color: var(--active-text);
    font-weight: 600;
  }

  .dsa-nav-link.active::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--active-pill);
    border-radius: 8px;
    z-index: -1;
    animation: navPillSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform, opacity;
  }

  @keyframes navPillSlide {
    from { transform: scaleY(0.6); opacity: 0; }
    to { transform: scaleY(1); opacity: 1; }
  }

  .dsa-nav-link span, .sidebar-brand span, .nav-group-title {
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: nowrap;
  }

  .dsa-sidebar.collapsed .dsa-nav-link span,
  .dsa-sidebar.collapsed .sidebar-brand span,
  .dsa-sidebar.collapsed .nav-group-title {
    opacity: 0;
    transform: translateX(-10px);
    pointer-events: none;
  }
  
  .dsa-sidebar.collapsed .sidebar-brand {
    padding-bottom: 1rem;
  }

  /* --- MAIN CONTENT AREA --- */
  main {
    margin-left: var(--sidebar-width);
    padding: 2rem 3rem;
    min-height: 100vh;
    transition: margin-left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .dsa-sidebar.collapsed + main {
    margin-left: var(--sidebar-collapsed-width);
  }

  .vista {
    animation: fadeInView 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeInView {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- LAYOUT RESTRUCTURING --- */
  .transition-all { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  
  .dsa-detail-panel {
    background: var(--card-bg);
    border-radius: 12px;
    border: 1px solid var(--separator);
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .form-section {
    background: var(--system-gray6);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 1.25rem;
    border: 1px solid var(--separator);
    transition: background 0.3s;
  }
  [data-theme="dark"] .form-section { background: rgba(255, 255, 255, 0.03); }

  .sticky-bottom {
    position: sticky;
    bottom: 0;
    background: var(--bg-color);
    border-top: 1px solid var(--separator);
    z-index: 10;
    padding: 1rem;
  }
  [data-theme="dark"] .sticky-bottom { background-color: #1c1c1e !important; }

  /* --- GLOBAL DROPZONE OVERLAY --- */


  @keyframes floatIcon {
    from { transform: translateY(0); }
    to { transform: translateY(-20px); }
  }

  /* --- SEARCH HIGHLIGHT --- */

  [data-theme="dark"] mark.mac-highlight { background-color: rgba(255, 214, 10, 0.3); color: #fff; }

  /* --- DYNAMIC STICKY SHADOW --- */


  .overflow-auto {
    scrollbar-width: thin;
    overflow-y: auto;
  }

  /* --- CONTEXT MENU (Native Desktop Style) --- */
  .context-menu {
    position: fixed;
    z-index: 3000;
    background: var(--card-bg);
    backdrop-filter: var(--glass-overlay);
    -webkit-backdrop-filter: var(--glass-overlay);
    border: 1px solid var(--separator);
    border-radius: 10px;
    box-shadow: var(--shadow-md);
    padding: 6px;
    min-width: 180px;
    animation: dsaScaleIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes dsaScaleIn {
    from { opacity: 0; transform: scale(0.95) translateY(-5px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .context-item {
    padding: 8px 12px;
    border-radius: 6px;
    font-size: var(--font-sm);
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .context-item:hover { background: var(--system-blue); color: white; }
  .context-item i { font-size: 1rem; width: 20px; text-align: center; }
  .context-divider { height: 1px; background: var(--separator); margin: 6px 0; }

  /* --- FILTER CHIPS --- */
  .filter-chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-chip {
    padding: 4px 12px;
    border-radius: 20px;
    background: var(--system-gray6);
    border: 1px solid var(--separator);
    font-size: var(--font-xs);
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .filter-chip:hover { background: var(--system-gray5); }
  .filter-chip.active {
    background: var(--system-blue);
    color: white;
    border-color: var(--system-blue);
  }

  /* --- GLASS TOOLTIPS --- */
  [data-tooltip] { position: relative; }
  [data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: var(--font-xs);
    font-weight: 400;
    line-height: var(--leading-tight);
    white-space: pre-wrap;
    width: max-content;
    max-width: 280px;
    z-index: 5000;
    pointer-events: none;
    box-shadow: var(--shadow-md);
    animation: dsaTooltipIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* ✅ Panel con glassmorphism más pronunciado */
  #panel-respuesta {
    background: rgba(var(--bg-color-rgb), 0.8) !important;
    backdrop-filter: var(--glass-overlay) !important;
    -webkit-backdrop-filter: var(--glass-overlay) !important;
    border-left: 1px solid rgba(255,255,255,0.15) !important;
    box-shadow: var(--shadow-lg) !important;
  }

  #panel-overlay {
    backdrop-filter: blur(8px) !important;
    background: rgba(0,0,0,0.32) !important;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
  }

  @keyframes dsaTooltipIn {
    from { opacity: 0; transform: translateX(-50%) translateY(0); }
    to { opacity: 1; transform: translateX(-50%) translateY(-10px); }
  }

  /* --- VIEW TRANSITIONS SUPPORT --- */
  ::view-transition-old(dashboard),
  ::view-transition-old(registro),
  ::view-transition-old(archivo) {
    animation: viewFadeOut 0.25s cubic-bezier(0.4, 0, 1, 1) forwards;
  }
  ::view-transition-new(dashboard),
  ::view-transition-new(registro),
  ::view-transition-new(archivo) {
    animation: viewFadeIn 0.3s cubic-bezier(0, 0, 0.2, 1) forwards;
  }

  @keyframes viewFadeOut {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(0.98); }
  }
  @keyframes viewFadeIn {
    from { opacity: 0; transform: scale(1.01) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* --- MAC WINDOW CARDS --- */
  .dsa-card {
    background: var(--card-bg);
    backdrop-filter: var(--glass-card);
    -webkit-backdrop-filter: var(--glass-card);
    border-radius: 12px;
    border: 1px solid var(--separator);
    box-shadow: var(--shadow-sm);
    margin-bottom: 2rem;
    overflow: hidden;
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dsa-card-header {
    padding: 0.75rem 1.25rem;
    background: rgba(0,0,0,0.02);
    border-bottom: 1px solid var(--separator);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .dsa-table-head {
    background-color: var(--table-head-bg) !important;
  }
  
  .dsa-table-head th {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card-bg) !important;
    backdrop-filter: var(--glass-card);
    -webkit-backdrop-filter: var(--glass-card);
    border-bottom: 1px solid var(--separator);
    box-shadow: 0 2px 8px rgba(0,0,0,0);
    transition: box-shadow 0.2s;
  }
  .dsa-table-head.scrolled th {
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  /* Traffic Lights */
  .traffic-lights {
    display: flex;
    gap: 8px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }

  /* --- STATS CARDS APPLE STYLE --- */
  .dsa-stats-card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 1.25rem;
    border: 1px solid var(--separator);
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    opacity: 0;
    animation: staggerIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    will-change: transform;
  }

  .dsa-stats-card:hover { 
    transform: scale(1.02) translateY(-2px); 
    box-shadow: var(--shadow-md);
  }
  .dsa-stats-card:nth-child(1) { animation-delay: 0.05s; }
  .dsa-stats-card:nth-child(2) { animation-delay: 0.1s; }
  .dsa-stats-card:nth-child(3) { animation-delay: 0.15s; }
  .dsa-stats-card:nth-child(4) { animation-delay: 0.2s; }

  @keyframes staggerIn {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .dsa-stats-card.hero {
    padding: 1.75rem;
    background: linear-gradient(135deg, var(--dsa-primary), #2a4a7f);
    color: white;
    border: none;
    position: relative;
    overflow: hidden;
  }

  .dsa-stats-card.hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
    animation: heroShine 8s ease-in-out infinite;
  }

  @keyframes heroShine {
    0%, 100% { transform: translate(-30%, -30%); }
    50% { transform: translate(10%, 10%); }
  }

  .dsa-stats-card.hero .stats-label { color: rgba(255,255,255,0.7); font-weight: 600; }
  .dsa-stats-card.hero .stats-value { font-size: 2.25rem; color: white; }
  .dsa-stats-card.hero .accent-bar { display: none; }

  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 4px;
  }

  .stats-label {
    font-size: var(--font-xs);
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    margin-bottom: 0.25rem;
  }

  .stats-value {
    font-size: var(--font-xl);
    font-weight: 700;
    letter-spacing: var(--tracking-tight);
  }

  /* --- WIZARD STEPPER (Connected Circles) --- */
  .dsa-stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin: 2rem 0;
  }

  .step-item {
    display: flex;
    align-items: center;
    position: relative;
  }

  .step-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--system-gray5);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--font-xs);
    font-weight: 600;
    z-index: 2;
    transition: all 0.3s ease;
    border: 2px solid transparent;
  }

  .step-item.active .step-dot {
    background: var(--system-blue);
    color: white;
    box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.2);
  }

  .step-item.completed .step-dot {
    background: var(--system-green);
    color: white;
  }

  .step-item.completed {
    cursor: pointer;
  }

  .step-line {
    width: 80px;
    height: 2px;
    background: var(--system-gray5);
    margin: 0 -1px;
    z-index: 1;
  }

  .step-item.completed + .step-line,
  .step-item.active + .step-line {
    background: var(--system-blue);
  }

  .step-label {
    position: absolute;
    top: 35px;
    left: 50%;
    transform: translateX(-50%);
    font-size: var(--font-xs);
    font-weight: 500;
    white-space: nowrap;
    color: var(--text-secondary);
  }

  .step-item.active .step-label { color: var(--system-blue); font-weight: 600; }

  /* Wizard Step Transition */
  .paso:not(.d-none) {
    animation: dsaSlideInStep 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    will-change: transform, opacity;
  }
  @keyframes dsaSlideInStep {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* --- APPLE BUTTONS --- */
  .dsa-btn {
    padding: 0.6rem 1.5rem;
    border-radius: 980px; /* Pill */
    font-size: var(--font-base);
    font-weight: 500;
    transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), 
                box-shadow 0.12s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.2s;
    border: none;
    cursor: pointer;
    box-shadow: var(--shadow-xs);
  }

  .dsa-btn-primary {
    background: var(--dsa-accent);
    color: white;
    font-weight: 600;
  }

  .dsa-btn:hover { 
    opacity: 0.95; 
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .dsa-btn:active { 
    transform: scale(0.97) translateY(1px);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  /* --- TICKET ACUSE --- */
  #ticket-acuse {
    border-top: 5px solid var(--dsa-primary);
    background: white;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }
  [data-theme="dark"] #ticket-acuse {
    background: #1c1c1e;
    border-color: var(--dsa-accent);
  }
  #ticket-acuse::after {
    content: "OFICIALÍA DE PARTES";
    position: absolute;
    bottom: -10px;
    right: -10px;
    font-size: 4rem;
    font-weight: 900;
    opacity: 0.03;
    transform: rotate(-10deg);
    pointer-events: none;
  }

  /* Button Loading State */
  .dsa-btn.loading {
    color: transparent !important;
    pointer-events: none;
