<script>
  /**
   * División de Servicios Administrativos (DSA) - Frontend Logic
   * @author Antigravity AI
   */

  // --- SILENCIADOR DE RUIDO DE ENTORNO (GAS INFRASTRUCTURE) ---
  (function() {
    const originalWarn = console.warn;
    const originalError = console.error;
    const noisePatterns = [
      'Feature Policy', 
      'dropping postMessage', 
      'accelerometer', 
      'gyroscope', 
      'payment', 
      'sync-xhr',
      'Quirks',
      'ambient-light-sensor',
      'magnetometer'
    ];

    console.warn = function(...args) {
      if (noisePatterns.some(p => String(args[0]).includes(p))) return;
      originalWarn.apply(console, args);
    };
    // No silenciamos errores críticos, solo los descriptivos del sandbox
    console.error = function(...args) {
      if (String(args[0]).includes('dropping postMessage')) return;
      originalError.apply(console, args);
    };
  })();
  
  console.log("DSA_App: Iniciando carga de scripts...");

  /**
   * UTILIDAD: Almacenamiento seguro para entornos restringidos (GAS Sandbox)
   */
  const SafeStorage = {
    getItem(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    },
    setItem(key, value) {
      try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
    }
  };

  /**
   * CONSTANTES DE SISTEMA (UX & Performance)
   */
  const TIMING = {
    TRANSITION: 400,
    DEBOUNCE: 300,
    TOAST: 5000,
    HEARTBEAT: 30000,
    LOADER_MIN: 800
  };

  const DSA_CONFIG = {
    MAX_FILE_SIZE: 10 * 1024 * 1024, // 10MB
    DEFAULT_OFFSET: 50,
    SELLO_PREFIX: 'DSA-AUTH-'
  };

  window.DSA_App = (function() {
  /**
   * --- EVENT BUS (Pub/Sub Pattern - Tarea #4) ---
   * Descentraliza la lógica de respuesta ante cambios de estado.
   */
  const EventBus = {
    listeners: {},
    on(event, callback) {
      if (!this.listeners[event]) this.listeners[event] = [];
      this.listeners[event].push(callback);
    },
    emit(event, data) {
      if (this.listeners[event]) this.listeners[event].forEach(cb => cb(data));
    }
  };

  /**
   * --- CAPA DE ESTADO (Reactive Proxy) ---
   */
  const AppState = new Proxy({
    vistaActual: 'v-dashboard',
    pasoActual: 1,
    extractedData: null,
    bibliotecaData: [],
    bibliotecaOffset: 0,
    bibliotecaFiltros: null,
    uploadId: null,
    oficioParaRespuesta: null,
    isProcessing: false,
    isSidebarCollapsed: SafeStorage.getItem('dsa-sidebar') === 'true',
    isDark: SafeStorage.getItem('dsa-theme') === 'dark',
    ultimaFilaConocida: 0
  }, {
    set(target, prop, value) {
      const old = target[prop];
      if (old !== value) {
        target[prop] = value;
        EventBus.emit(`change:${prop}`, value);
      }
      return true;
    }
  });

  /**
   * --- SUSCRIPCIONES REACTIVAS (Tarea #4) ---
   * Reemplaza la "God Function" _onStateChange con observadores.
   */
  EventBus.on('change:isDark', (value) => {
    document.documentElement.setAttribute('data-theme', value ? 'dark' : 'light');
    SafeStorage.setItem('dsa-theme', value ? 'dark' : 'light');
    const icon = document.getElementById('theme-icon');
    if (icon) {
      if (value) {
        icon.classList.replace('bi-moon-stars', 'bi-sun');
        icon.style.transform = 'rotate(180deg)';
      } else {
        icon.classList.replace('bi-sun', 'bi-moon-stars');
        icon.style.transform = 'rotate(0deg)';
      }
    }
  });

  EventBus.on('change:isSidebarCollapsed', (value) => {
    const sidebar = document.querySelector('.dsa-sidebar');
    const icon = document.getElementById('sidebar-icon');
    const label = document.querySelector('[onclick="DSA_App.toggleSidebar()"] span');
    if (sidebar) sidebar.classList.toggle('collapsed', value);
    if (icon) icon.classList.toggle('bi-layout-sidebar-reverse', value);
    if (label) label.innerText = value ? 'Expandir' : 'Contraer';
    SafeStorage.setItem('dsa-sidebar', value);
  });

  EventBus.on('change:isProcessing', (value) => {
    document.querySelectorAll('.btn-primary, .btn-success, #pdf-input').forEach(el => el.disabled = value);
    const dropzone = document.getElementById('dropzone');
    if (dropzone) dropzone.style.opacity = value ? '0.5' : '1';
  });

  EventBus.on('change:vistaActual', (value) => {
    _actualizarNavegacion(value);
    _actualizarBreadcrumb(value);
  });

  /**
   * Actualiza el breadcrumb institucional basado en la vista activa.
   * @param {string} idVista - ID de la vista (v-dashboard, etc.)
   * @private
   */
  function _actualizarBreadcrumb(idVista) {
    const breadcrumb = document.getElementById('app-breadcrumb');
    if (!breadcrumb) return;

    const routes = {
      'v-dashboard': 'Inicio <span class="mx-2">/</span> Resumen',
      'v-registro': 'Inicio <span class="mx-2">/</span> Nuevo Registro',
      'v-archivo': 'Inicio <span class="mx-2">/</span> Biblioteca'
    };
    breadcrumb.innerHTML = routes[idVista] || 'Inicio';
  }

  /**
   * Gestiona la visibilidad de los contenedores de vista y el estado del sidebar.
   * @param {string} idVista - ID de la vista a activar.
   * @private
   */
  function _actualizarNavegacion(idVista) {
    document.querySelectorAll('.vista').forEach(v => v.classList.add('d-none'));
    const target = document.getElementById(idVista);
    if (target) {
      target.classList.remove('d-none');
      
      // Actualizar sidebar active state
      document.querySelectorAll('.dsa-nav-link').forEach(link => {
        link.classList.remove('active');
        if (link.getAttribute('onclick')?.includes(idVista)) {
          link.classList.add('active');
        }
      });
    }
  }


  /**
   * Inicializa los componentes básicos del sistema y carga datos iniciales.
   * @public
   */
  function init() {
    cambiarVista('v-dashboard');
    initDragAndDrop();
    initContextMenu();
    _detectarOS();
    _initEventDelegation();
    
    // Aplicar tema inicial
    if (AppState.isDark) document.documentElement.setAttribute('data-theme', 'dark');

    // Cargar datos iniciales
    cargarEstadisticasInicio();

    // Escuchar búsqueda en biblioteca
    const searchInput = document.getElementById('filtro-texto');
    if (searchInput) {
      searchInput.addEventListener('input', _debounce(() => aplicarFiltrosBiblioteca(), TIMING.DEBOUNCE));
    }

    // Auto-resize textareas (Fluid Apple Style)
    document.querySelectorAll('textarea.dsa-input').forEach(el => {
      // Definir altura base
      el.style.height = el.scrollHeight + 'px'; 
      el.addEventListener('input', function() {
        // Guardar scroll actual para evitar saltos en la página
        const scrollPos = window.scrollY;

        // Magia: reducir a 1px para obtener el scrollHeight real del contenido actual
        this.style.height = '1px'; 
        const newHeight = this.scrollHeight;

        // Restaurar el nuevo height
        this.style.height = newHeight + 'px';

        window.scrollTo(0, scrollPos);
      });
    });

    // --- GLOBAL DROPZONE LOGIC ---
    let dragTimer;
    document.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (e.dataTransfer.types.includes('Files')) {
        document.getElementById('global-dropzone')?.classList.remove('d-none');
        clearTimeout(dragTimer);
      }
    });
    document.addEventListener('dragleave', () => {
      dragTimer = setTimeout(() => document.getElementById('global-dropzone')?.classList.add('d-none'), 150);
    });
    document.addEventListener('drop', (e) => {
      e.preventDefault();
      document.getElementById('global-dropzone')?.classList.add('d-none');
      const file = e.dataTransfer.files[0];
      if (file && file.type === 'application/pdf') {
        cambiarVista('v-registro');
        handleFile(file);
      }
    });

    // --- DYNAMIC STICKY SHADOWS ---
    const containers = ['biblio-master', 'v-archivo'];
    containers.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('scroll', () => {
          const topBar = document.querySelector('.dsa-topbar');
          if (el.scrollTop > 10) topBar?.classList.add('sticky-scrolled');
          else topBar?.classList.remove('sticky-scrolled');
        });
      }
    });

    // Atajos de Teclado (UX Legendaria)
    document.addEventListener('keydown', (e) => {
      // Escape cierra el panel lateral o el command palette
      if (e.key === 'Escape') {
        const panel = document.getElementById('panel-respuesta');
        if (panel && !panel.classList.contains('d-none')) cerrarPanelRespuesta();
        
        const palette = document.getElementById('cmd-palette');
        if (palette && !palette.classList.contains('d-none')) _toggleCommandPalette();
      }

      // Cmd+K o Ctrl+K enfoca el buscador
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        cambiarVista('v-archivo');
        setTimeout(() => {
          const searchInput = document.getElementById('filtro-texto');
          if (searchInput) searchInput.focus();
        }, 150);
      }

      // Cmd+Shift+P para Command Palette
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 'p') {
        e.preventDefault();
        _toggleCommandPalette();
      }

      // Cmd+1/2/3 para Cambiar Vistas
      if ((e.metaKey || e.ctrlKey) && ['1','2','3'].includes(e.key)) {
        e.preventDefault();
        const vistas = ['v-dashboard', 'v-registro', 'v-archivo'];
        cambiarVista(vistas[parseInt(e.key) - 1]);
      }

      // Cmd+N para Nuevo Registro
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n') {
        e.preventDefault();
        cambiarVista('v-registro');
      }
    });

    if (AppState.isSidebarCollapsed) {
      document.querySelector('.dsa-sidebar')?.classList.add('collapsed');
      const icon = document.getElementById('sidebar-icon');
      if (icon) icon.classList.add('bi-layout-sidebar-reverse');
      const label = document.querySelector('[onclick="DSA_App.toggleSidebar()"] span');
      if (label) label.innerText = 'Expandir';
    }

    // --- ELITE HEARTBEAT (Tarea #3) ---
    // Sincronización silenciosa cada 30 segundos
    setInterval(() => {
      // Solo si el usuario está en el dashboard y no hay procesos bloqueantes
      if (AppState.vistaActual === 'v-dashboard' && !AppState.isProcessing) {
        google.script.run
          .withFailureHandler(err => console.error("Error en Heartbeat:", err))
          .withSuccessHandler(nuevaUltimaFila => {
            if (nuevaUltimaFila > AppState.ultimaFilaConocida && AppState.ultimaFilaConocida !== 0) {
              console.log("Detectados datos nuevos. Sincronizando dashboard...");
              cargarEstadisticasInicio(true); // Carga silenciosa
            }
            AppState.ultimaFilaConocida = nuevaUltimaFila;
          })
          .checarActualizaciones();
      }
    }, TIMING.HEARTBEAT);
  }

  /**
   * Centraliza el manejo de clics en la tabla para optimizar rendimiento.
   * @private
   */
  function _initEventDelegation() {
    const tbody = document.getElementById('tabla-biblioteca-body');
    if (tbody) {
      tbody.addEventListener('click', (e) => {
        const tr = e.target.closest('tr');
        if (!tr) return;
        if (e.target.closest('.btn-link')) return; // Ignorar clics en el enlace de PDF
        
        const index = tr.getAttribute('data-index');
        if (index !== null) mostrarDetalleOficio(index);
      });
    }
  }


  /**
   * Gestiona el cambio de vista con transiciones nativas o fallback.
   * @param {string} idVista - ID de la vista destino.
   * @public
   */
  function cambiarVista(idVista) {
    if (AppState.vistaActual === idVista) return;

    // PROTECCIÓN DE DATOS: Si estamos en registro y ya hay un PDF cargado
    if (AppState.vistaActual === 'v-registro' && AppState.pdfFile && idVista !== 'v-registro') {
      const confirmar = confirm("Tiene un oficio en proceso de registro. Si sale ahora, se perderán los datos extraídos. ¿Desea abandonar la página?");
      if (!confirmar) return; // Abortar navegación
      resetForm(); // Limpiar si decide salir
    }

    if (!document.startViewTransition) {
      // Fallback para navegadores antiguos
      AppState.vistaActual = idVista;
      if (idVista === 'v-archivo') cargarBiblioteca();
      if (idVista === 'v-dashboard') cargarEstadisticasInicio();
      return;
    }

    document.startViewTransition(() => {
      AppState.vistaActual = idVista;
      if (idVista === 'v-archivo') cargarBiblioteca();
      if (idVista === 'v-dashboard') cargarEstadisticasInicio();
    });
  }

  /**
   * Controla la navegación del Wizard de registro.
   * @param {number} numeroPaso - Número de paso (1, 2 o 3).
   * @public
   */
  function cambiarPaso(numeroPaso) {
    document.querySelectorAll('.paso').forEach(p => p.classList.add('d-none'));
    const target = document.getElementById(`paso-${numeroPaso}`);
    if (target) {
      target.classList.remove('d-none');
      AppState.pasoActual = numeroPaso;
      
      // Actualizar Stepper UI
      document.querySelectorAll('.step-item').forEach((item, idx) => {
        const stepNum = idx + 1;
        item.classList.remove('active', 'completed');
        if (stepNum === numeroPaso) {
          item.classList.add('active');
        } else if (stepNum < numeroPaso) {
          item.classList.add('completed');
        }
      });

      // Si es el paso 3, actualizar resumen
      if (numeroPaso === 3) {
        document.getElementById('res-titular').innerText = document.getElementById('campo-titular').value || 'N/A';
        document.getElementById('res-area').innerText = document.getElementById('campo-area').value || 'N/A';
        document.getElementById('res-oficio').innerText = document.getElementById('campo-oficio').value || 'N/A';
        document.getElementById('res-tipo-doc').innerText = document.getElementById('campo-tipo-doc').value || 'N/A';
        document.getElementById('res-urgencia').innerText = document.getElementById('campo-urgencia').value || 'Normal';
        document.getElementById('res-requiere-respuesta').innerText = document.getElementById('campo-requiere-respuesta').checked ? 'SÍ' : 'NO';
      }
    }
  }

  /**
   * Valida campos obligatorios en el Paso 2 antes de avanzar.
   */
  function validarYContinuar() {
    let isValid = true;
    const camposRequeridos = ['campo-titular', 'campo-oficio'];

    camposRequeridos.forEach(id => {
      const el = document.getElementById(id);
      el.classList.remove('input-error'); // Reset
      if (!el.value.trim()) {
        // Forzar reflow para reiniciar la animación
        void el.offsetWidth;
        el.classList.add('input-error');
        isValid = false;
      }
    });

    if (isValid) {
      cambiarPaso(3);
    } else {
      showToast('Campos Requeridos', 'Por favor completa los campos resaltados en rojo.', 'warning');
    }
  }

  /**
   * Inicializa los eventos de drag & drop para el dropzone de registro.
   * @public
   */
  function initDragAndDrop() {
    const dropzone = document.getElementById('dropzone');
    const input = document.getElementById('pdf-input');

    if (!dropzone) return;

    dropzone.addEventListener('click', () => input.click());
    
    input.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    const dropText = dropzone.querySelector('h4');
    const dropIcon = dropzone.querySelector('i');
    const defaultText = dropText.innerText;

    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, e => {
        e.preventDefault(); e.stopPropagation();
        dropzone.style.borderColor = 'var(--system-blue)';
        dropzone.style.background = 'rgba(0, 122, 255, 0.05)';
        dropzone.style.transform = 'scale(1.02)'; // Efecto de succión
        dropText.innerText = "¡Suelta el archivo aquí!";
        dropIcon.classList.replace('bi-file-earmark-arrow-up', 'bi-cloud-arrow-down-fill');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, e => {
        e.preventDefault(); e.stopPropagation();
        dropzone.style.borderColor = '';
        dropzone.style.background = '';
        dropzone.style.transform = 'scale(1)';
        dropText.innerText = defaultText;
        dropIcon.classList.replace('bi-cloud-arrow-down-fill', 'bi-file-earmark-arrow-up');
      }, false);
    });

    dropzone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const file = dt.files[0];
      if (file && file.type === 'application/pdf') {
        handleFile(file);
      } else {
        showToast('Error', 'Por favor selecciona un archivo PDF.', 'danger');
      }
    });
  }

  /**
   * Procesa el archivo seleccionado, valida tamaño y prepara transferencia.
   * @param {File} file - Objeto de archivo PDF.
   * @public
   */
  function handleFile(file) {
    // Validación de Tamaño (10MB límite para evitar errores de payload en GAS)
    if (file.size > DSA_CONFIG.MAX_FILE_SIZE) {
      showToast('Archivo demasiado grande', 'El PDF supera los 10MB. Por favor optimiza el archivo antes de subirlo.', 'warning');
      return;
    }

    // Mostrar loader inmediatamente durante la lectura local
    toggleLoading(true, "Leyendo archivo...", "Preparando transferencia segura...");

    if (file.type !== 'application/pdf') {
      showToast('Formato Inválido', 'Solo se permiten archivos PDF.', 'danger');
      toggleLoading(false);
      return;
    }
    AppState.pdfFile = file;
    AppState.uploadId = 'up_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    
    // ✅ Mostrar chip de archivo seleccionado en el dropzone (UX Elite)
    const dropzone = document.getElementById('dropzone');
    if (dropzone) {
      let chip = document.getElementById('file-chip');
      if (!chip) {
        chip = document.createElement('div');
        chip.id = 'file-chip';
        chip.className = 'd-flex align-items-center gap-2 mt-4 p-3 rounded-4 bg-primary-subtle animate-fade-in';
        chip.style.border = '1px solid var(--system-blue)';
        dropzone.appendChild(chip);
      }
      chip.innerHTML = `
        <div class="bg-primary text-white rounded-3 p-2 d-flex align-items-center">
          <i class="bi bi-file-earmark-pdf-fill"></i>
        </div>
        <div class="text-start overflow-hidden">
          <div class="small fw-bold text-primary text-truncate" style="max-width: 180px;">${file.name}</div>
          <div class="text-secondary" style="font-size: 0.65rem;">${(file.size/1024).toFixed(0)} KB • PDF</div>
        </div>
        <button class="btn-close btn-close-sm ms-auto" onclick="event.stopPropagation(); DSA_App.resetForm()"></button>
      `;
    }

    // Render PDF localmente
    const objectUrl = URL.createObjectURL(file);
    document.getElementById('pdf-viewer').src = objectUrl;

    // Convertir a Base64 para GAS
    const reader = new FileReader();
    reader.onload = function(e) {
      AppState.pdfBase64 = e.target.result.split(',')[1];
      procesarDocumento();
    };
    reader.readAsDataURL(file);
  }

  /**
   * Efecto Typewriter para campos poblados por IA (Innovación #18)
   */
  function _typewriteInput(el, value, speed = 20) {
    if (!el) return;
    el.value = '';
    el.classList.add('ai-populating');
    let i = 0;
    const interval = setInterval(() => {
      if (i < value.length) {
        el.value += value[i];
        i++;
        // Auto-scroll en textareas
        if (el.tagName === 'TEXTAREA') el.dispatchEvent(new Event('input'));
      } else {
        clearInterval(interval);
        el.classList.remove('ai-populating');
        el.dispatchEvent(new Event('change'));
      }
    }, speed);
  }

  /**
   * Envía el documento al motor de IA para extracción de metadatos.
   * Implementa un sistema de progreso por etapas para UX fluida.
   * @private
   */
  function procesarDocumento() {
    AppState.isProcessing = true;
    
    // --- PATRÓN ELITE: Progreso por etapas con significado ---
    const stages = [
      { pct: 10, msg: 'Analizando estructura del documento...', duration: 800 },
      { pct: 30, msg: 'Enviando a motor de IA (DSA-Intelligence)...', duration: 2000 },
      { pct: 60, msg: 'Extrayendo metadatos oficiales...', duration: 3000 },
      { pct: 85, msg: 'Validando integridad de la información...', duration: 2000 },
      { pct: 95, msg: 'Organizando datos para revisión...', duration: 1000 }
    ];

    let stageIdx = 0;
    const updateStage = () => {
      if (stageIdx < stages.length) {
        const s = stages[stageIdx];
        toggleLoading(true, "Procesando...", s.msg);
        const progressBar = document.getElementById('loader-progress');
        if (progressBar) {
          progressBar.style.width = s.pct + '%';
          if (s.pct >= 90) progressBar.classList.add('processing');
        }
        stageIdx++;
        
        // Programar siguiente etapa si existe
        if (stageIdx < stages.length) {
          msgTimeout = setTimeout(updateStage, s.duration);
        }
      }
    };

    let msgTimeout = setTimeout(updateStage, 10);


    // Temporizador de seguridad extendido (90 segundos)
    const timeoutId = setTimeout(() => {
      if (AppState.isProcessing) {
        AppState.isProcessing = false;
        clearTimeout(msgTimeout);
        toggleLoading(false);
        showToast('Timeout', 'La operación tardó demasiado. Intenta con un archivo más ligero.', 'danger');
      }
    }, 90000);

    google.script.run
      .withSuccessHandler(response => {
        clearTimeout(timeoutId);
        clearTimeout(msgTimeout);
        
        if (response && response.success) {
          AppState.extractedData = response.data;
          poblarFormulario(response.data);
          cambiarPaso(2);
          const progressBar = document.getElementById('loader-progress');
          if (progressBar) progressBar.style.width = '100%';
          showToast('Éxito', 'Información procesada correctamente.', 'success');
        } else {
          const msg = response ? response.message : "Error desconocido en el servidor";
          showToast('Error', msg, 'danger');
        }
        AppState.isProcessing = false;
        toggleLoading(false);
      })
      .withFailureHandler(err => {
        clearTimeout(timeoutId);
        clearTimeout(msgTimeout);
        showToast('Error de Servidor', err.message, 'danger');
        AppState.isProcessing = false;
        toggleLoading(false);
      })
      .procesarDocumento(AppState.pdfBase64, AppState.pdfFile.name);
  }

  /**
   * Puebla los campos del formulario con los datos extraídos por la IA.
   * @param {Object} data - Metadatos extraídos.
   * @private
   */
  function poblarFormulario(data) {
    _typewriteInput(document.getElementById('campo-titular'), data.titular || '');
    _typewriteInput(document.getElementById('campo-area'), data.area || '');
    _typewriteInput(document.getElementById('campo-oficio'), data.oficio || '');
    _typewriteInput(document.getElementById('campo-asunto'), data.asunto || '');
    
    document.getElementById('campo-tipo-doc').value = data.tipo_doc || 'Informativo';
    document.getElementById('campo-urgencia').value = data.urgencia || 'Normal';
    document.getElementById('campo-requiere-respuesta').checked = !!data.requiere_respuesta;
  }

  // --- CONFIRMACIÓN FINAL ---
  function registrarOficioFinal() {
    const data = {
      titular: document.getElementById('campo-titular').value,
      area: document.getElementById('campo-area').value,
      oficio: document.getElementById('campo-oficio').value,
      asunto: document.getElementById('campo-asunto').value,
      tipo_doc: document.getElementById('campo-tipo-doc').value,
      urgencia: document.getElementById('campo-urgencia').value,
      requiere_respuesta: document.getElementById('campo-requiere-respuesta').checked,

  /**
   * Solicita estadísticas operativas al servidor y actualiza la UI del Dashboard.
   * @param {boolean} [silent=false] - Si es true, no muestra skeletons durante la carga.
   * @public
   */
  function cargarEstadisticasInicio(silent = false) {
    if (!silent) {
      // ✅ Mostrar skeletons en stats mientras carga
      ['stat-total', 'stat-pendientes', 'stat-urgentes', 'stat-hoy'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = '<div class="skeleton-box" style="width: 48px; height: 1.75rem; border-radius: 6px;"></div>';
      });
    }

    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          const d = res.data;
          document.getElementById('stat-total').innerText = d.total || 0;
          document.getElementById('stat-pendientes').innerText = d.pendientes || 0;
          document.getElementById('stat-urgentes').innerText = d.urgentes || 0;
          document.getElementById('stat-hoy').innerText = d.registradosHoy || 0;
          
          AppState.ultimaFilaConocida = d.ultimaFila || 0;
          
          const total = d.total || 0;
          const pendientes = d.pendientes || 0;
          const atendidos = total - pendientes;
          const porcentaje = total === 0 ? 100 : Math.round((atendidos / total) * 100);

          // Animar gráfica
          setTimeout(() => {
            const circle = document.getElementById('chart-circle');
            const percent = document.getElementById('chart-percent');
            if (circle) circle.style.strokeDasharray = `${porcentaje} ${100 - porcentaje}`;
            if (percent) percent.innerText = `${porcentaje}%`;
            
            // Cambiar color según salud operativa
            if (circle) circle.style.stroke = porcentaje > 80 ? 'var(--system-green)' : (porcentaje > 50 ? 'var(--system-orange)' : 'var(--system-red)');
          }, 100);

          _renderizarRecientes(d.recientes);
        } else {
          console.error("Error al cargar estadísticas (Response):", res);
        }
      })
      .withFailureHandler(err => {
        console.error("Error de red/GAS en cargarEstadisticasInicio:", err);
      })
      .obtenerEstadisticas();
  }

  function seleccionarChip(tipo, valor) {
    const container = document.getElementById(`chip-${tipo}`);

    container.querySelectorAll('.filter-chip').forEach(chip => {

  // --- MENÚ CONTEXTUAL (Tarea #5) ---
  let _contextMenuInicializado = false;

  /**
   * Inicializa el menú contextual personalizado para las filas de la biblioteca.
   * @public
   */
  function initContextMenu() {
    if (_contextMenuInicializado) return;
    const menu = document.getElementById('context-menu');
    
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#context-menu')) menu.classList.add('d-none');
    });

    document.addEventListener('contextmenu', (e) => {
      const row = e.target.closest('#tabla-biblioteca-body tr');
      if (!row) {
        menu.classList.add('d-none');
        return;
      }
      
      e.preventDefault();
      const index = row.getAttribute('data-index');
      const reg = AppState.bibliotecaData[index];
      
      menu.innerHTML = ''; // Limpiar previo
      
      const items = [
        { icon: 'bi-eye', label: 'Ver Detalles', action: () => mostrarDetalleOficio(index) },
        { icon: 'bi-reply', label: 'Responder', action: () => abrirPanelRespuesta(index) },
        null, // divider
        { icon: 'bi-clipboard', label: 'Copiar Oficio', action: () => _copiarAlPortapapeles(reg.oficio) },
        { icon: 'bi-box-arrow-up-right', label: 'Abrir Original', action: () => window.open(reg.url, '_blank') }
      ];

      items.forEach(item => {
        if (!item) {
          const div = document.createElement('div');
          div.className = 'context-divider';
          menu.appendChild(div);
          return;
        }
        const div = document.createElement('div');
        div.className = 'context-item';
        div.innerHTML = `<i class="bi ${item.icon}"></i>`;
        const span = document.createElement('span');
        span.textContent = ' ' + item.label;
        div.appendChild(span);
        div.addEventListener('click', (e) => {
          e.stopPropagation();
          item.action();
          menu.classList.add('d-none');
        });
        menu.appendChild(div);
      });
      
      menu.classList.remove('d-none');
      
      // Posicionamiento inteligente
      let x = e.clientX;
      let y = e.clientY;
      if (x + 200 > window.innerWidth) x -= 200;
      if (y + 200 > window.innerHeight) y -= 200;
      
      menu.style.left = x + 'px';
      menu.style.top = y + 'px';
    });

    _contextMenuInicializado = true;
  }

  function _copiarAlPortapapeles(texto) {
    navigator.clipboard.writeText(texto).then(() => {
      showToast('Copiado', 'El número de oficio se copió al portapapeles', 'success');
    });
  }

  /**
   * Envía la solicitud de generación de respuesta al servidor.
   * @param {boolean} asistido - Si true, utiliza el motor de IA avanzado.
   * @param {Event} e - Evento de clic (para capturar el botón).
   * @public
   */
  function ejecutarGeneracion(asistido, e) {
    const notas = document.getElementById('resp-notas').value;
    if (!notas.trim()) {
      showToast('Atención', 'Por favor escribe los puntos clave para la respuesta.', 'warning');
      return;
    }

    const payload = {
      titular: document.getElementById('resp-titular').value,
      area: document.getElementById('resp-area-val').value,
      oficio: document.getElementById('resp-oficio-val').value,
      asunto: document.getElementById('resp-asunto-val').value,
      notasUsuario: notas,
      asistido: asistido
    };

    const btn = e?.currentTarget; // Capturar botón presionado de forma segura
    if (btn) btn.classList.add('loading');

    google.script.run
      .withSuccessHandler(res => {
        if (btn) btn.classList.remove('loading');
        console.log("Servidor respondió:", res);
        toggleLoading(false);
        try {
          if (res && res.success) {
            showToast('Éxito', 'Documento generado y registrado correctamente.', 'success');
            cerrarPanelRespuesta();
            // Abrir en nueva pestaña si es posible
            if (res.url) {
              const win = window.open(res.url, '_blank');
              if (!win) showToast('Aviso', 'El documento se creó, pero el navegador bloqueó la ventana emergente.', 'warning');
            }
          } else {
            const msg = res ? res.message : "Respuesta vacía del servidor";
            showToast('Error de Generación', msg, 'danger');
          }
        } catch (e) {
          console.error("Error en success handler:", e);
          showToast('Error', 'Fallo al procesar respuesta del servidor.', 'danger');
        }
      })
      .withFailureHandler(err => {
        if (btn) btn.classList.remove('loading');
        toggleLoading(false);
        console.error("Fallo crítico en EjecutarGeneracion:", err);
        const msg = err ? err.message : "Error desconocido de red";
        showToast('Error Crítico', msg, 'danger');
      })
      .generarRespuestaOficio(payload);
  }

  /**
   * Carga los registros de la biblioteca desde el servidor.
   * @param {boolean} [append=false] - Si true, añade los datos a la lista existente (paginación).
   * @public
   */
  function cargarBiblioteca(append = false) {
    if (!append) {
      AppState.bibliotecaOffset = 0;
      AppState.bibliotecaData = [];
      
      // Mostrar esqueletos mientras carga
      const tbody = document.getElementById('tabla-biblioteca-body');
      if (tbody) {
        tbody.innerHTML = Array(6).fill(`
          <tr>
            <td class="ps-4"><div class="skeleton-box" style="width: 70px;" role="status" aria-label="Cargando fecha..." aria-busy="true"></div></td>
            <td><div class="cell-group"><div class="skeleton-box" style="width: 140px;" role="status" aria-label="Cargando titular..." aria-busy="true"></div><div class="skeleton-box" style="width: 100px;" role="status" aria-label="Cargando área..." aria-busy="true"></div></div></td>
            <td><div class="cell-group"><div class="skeleton-box" style="width: 100px;" role="status" aria-label="Cargando oficio..." aria-busy="true"></div><div class="skeleton-box" style="width: 60px;" role="status" aria-label="Cargando tipo..." aria-busy="true"></div></div></td>
            <td><div class="skeleton-box" style="width: 80px; border-radius: 20px;" role="status" aria-label="Cargando prioridad..." aria-busy="true"></div></td>
            <td class="text-center"><div class="skeleton-box" style="width: 24px;" role="status" aria-label="Cargando enlace..." aria-busy="true"></div></td>
          </tr>
        `).join('');
      }
    }

    google.script.run
      .withSuccessHandler(res => {
        toggleLoading(false);
        if (res && res.success) {
          if (append) {
            AppState.bibliotecaData = [...AppState.bibliotecaData, ...res.data];
          } else {
            AppState.bibliotecaData = res.data;
          }
          
          _poblarFiltroAreas(AppState.bibliotecaData);
          renderizarTablaBiblioteca(AppState.bibliotecaData);
          
          // Gestionar botón de cargar más
          const btnLoadMore = document.getElementById('btn-cargar-mas');
          if (btnLoadMore) {
            btnLoadMore.classList.toggle('d-none', !res.hasMore);
          }
        } else {
          const msg = res ? res.message : "Error al cargar los datos";
          showToast('Error', msg, 'danger');
        }
      })
      .withFailureHandler(err => {
        toggleLoading(false);
        console.error("Error de red/GAS en cargarBiblioteca:", err);
        showToast('Error de Servidor', err.message, 'danger');
      })
      .obtenerRegistros(AppState.bibliotecaOffset, DSA_CONFIG.DEFAULT_OFFSET, AppState.bibliotecaFiltros);

  function _poblarFiltroAreas(data) {
    const areas = [...new Set(data.map(r => r.area).filter(a => a))].sort();

    select.innerHTML = '<option value="">Todas las Áreas</option>';
    areas.forEach(area => {
      select.insertAdjacentHTML('beforeend', `<option value="${area}">${area}</option>`);
    });
  }

  function aplicarFiltrosBiblioteca() {
    const filtrados = {
      texto: document.getElementById('filtro-texto').value,
      prioridad: _getValChip('prioridad'),
      tipo: _getValChip('tipo'),
      respuesta: _getValChip('respuesta')

    AppState.bibliotecaFiltros = filtrados;
    cargarBiblioteca(false);

  /**
   * Renderiza las filas de la tabla de biblioteca con los datos proporcionados.
   * @param {Array} data - Lista de objetos de registro.
   * @public
   */
  function renderizarTablaBiblioteca(data) {
    const tbody = document.getElementById('tabla-biblioteca-body');
    if (!tbody) return;

    if (data.length === 0) {
      tbody.innerHTML = '';
      return;
    }

    const html = data.map((reg, index) => {
      const colorPrioridad = {
        'Baja': 'secondary',
        'Normal': 'primary',
        'Alta': 'warning',
        'Crítica': 'danger'
      }[reg.urgencia] || 'primary';

      const btnDoc = reg.url 
        ? `<a href="${reg.url}" target="_blank" class="btn btn-sm btn-link p-0 text-primary" title="Ver Documento" onclick="event.stopPropagation()">
             <i class="bi bi-file-earmark-pdf" style="font-size: 1.1rem;"></i>
           </a>`
        : `<i class="bi bi-file-earmark-pdf text-secondary opacity-25" style="font-size: 1.1rem;"></i>`;

      const fechaHumanizada = _formatearTiempoRelativo(reg.fecha);

      return `
        <tr data-index="${index}" style="cursor: pointer;">
          <td class="ps-4 small text-secondary tabular-nums" data-tooltip="${reg.fecha}">${fechaHumanizada}</td>
          <td>
            <div class="cell-group" data-tooltip="${_escaparHTML(reg.asunto)}">
              <div class="fw-medium text-truncate" style="max-width: 150px;">${_resaltar(reg.titular)}</div>
              <div class="small text-secondary text-truncate" style="max-width: 150px;">${_resaltar(reg.area)}</div>
            </div>
          </td>
          <td>
            <div class="cell-group">
              <div class="small font-monospace tabular-nums">${_resaltar(reg.oficio)}</div>
              <div><span class="badge bg-light text-dark border" style="font-size: 0.6rem;">${reg.tipo_doc}</span></div>
            </div>
          </td>
          <td><span class="badge bg-${colorPrioridad}-subtle text-${colorPrioridad} rounded-pill px-3">${reg.urgencia}</span></td>
          <td class="pe-4 text-center">${btnDoc}</td>
        </tr>
      `;
    }).join('');

    tbody.innerHTML = html;
  }

  // --- UTILIDADES ---

  function _getValChip(tipo) {
    const active = document.querySelector(`#chip-${tipo} .filter-chip.active`);
    if (!active) return '';
    const text = active.innerText;
    if (text === 'Todas' || text === 'Todos' || text === 'Ambos') return '';
    if (text === 'Sí') return 'SÍ';
    if (text === 'No') return 'NO';
    return text;
  }

  function _formatearTiempoRelativo(fechaStr) {
    if (!fechaStr) return '---';
    try {
      const [d, m, y] = fechaStr.split('/').map(Number);
      const fecha = new Date(y, m - 1, d);
      const hoy = new Date();
      const diffMs = hoy - fecha;
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      if (diffDays === 0) return 'Hoy';
      if (diffDays === 1) return 'Ayer';
      if (diffDays < 7) {
        const rtf = new Intl.RelativeTimeFormat('es', { numeric: 'auto' });
        return rtf.format(-diffDays, 'day');
      }
      return fechaStr;
    } catch (e) {
      return fechaStr;
    }
  }

  // --- UTILIDADES ---
  
  /**
   * Escapa HTML nativo para evitar XSS.
   */
  /**
   * Resalta el texto que coincide con el filtro de búsqueda.
   * @param {string} texto - Texto original.
   * @returns {string} - Texto con etiquetas <mark> si hay coincidencia.
   * @private
   */
  function _resaltar(texto) {
    if (!texto) return '';
    const filtro = document.getElementById('filtro-texto')?.value?.trim();
    if (!filtro) return _escaparHTML(texto);
    
    const escapedText = _escaparHTML(texto);
    try {
      const regex = new RegExp(`(${_escaparHTML(filtro)})`, 'gi');
      return escapedText.replace(regex, '<mark class="dsa-highlight">$1</mark>');
    } catch(e) {
      return escapedText;
    }
  }

  function _escaparHTML(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  /**
   * Genera un hash visual (firma QR-like) para el acuse (Innovación #20)
   */
  function _generarSelloVisual(uploadId) {
    if (!uploadId) return '';
    const hash = uploadId.split('').reduce((acc, c) => ((acc << 5) - acc) + c.charCodeAt(0), 0);
    const hue = Math.abs(hash % 360);
    return `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:hsl(${hue},75%,55%);margin-right:4px;box-shadow: 0 0 5px hsl(${hue},75%,55%);"></span>
            <code style="font-size:0.55rem;letter-spacing:1px;opacity:0.8;">${uploadId}</code>`;
  }

  /**
   * --- COMMAND PALETTE (Innovación #19) ---
   */
  let _commands = [
    { icon: 'bi-house-door', label: 'Ir al Inicio', action: () => cambiarVista('v-dashboard'), shortcut: '⌘1', category: 'Navegación' },
    { icon: 'bi-file-earmark-plus', label: 'Nuevo Registro', action: () => cambiarVista('v-registro'), shortcut: '⌘2', category: 'Operaciones' },
    { icon: 'bi-collection', label: 'Ver Acervo / Biblioteca', action: () => cambiarVista('v-archivo'), shortcut: '⌘3', category: 'Navegación' },
    { icon: 'bi-moon-stars', label: 'Cambiar Tema (Oscuro/Claro)', action: () => toggleTheme(), shortcut: 'Cmd+Shift+L', category: 'Preferencias' },
    { icon: 'bi-layout-sidebar', label: 'Contraer/Expandir Sidebar', action: () => toggleSidebar(), shortcut: 'Cmd+B', category: 'Preferencias' },
    { icon: 'bi-printer', label: 'Imprimir página actual', action: () => window.print(), shortcut: '⌘P', category: 'Sistema' }
  ];

  function _toggleCommandPalette() {
    let overlay = document.getElementById('cmd-palette-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'cmd-palette-overlay';
      overlay.className = 'cmd-palette-overlay d-none';
      overlay.innerHTML = `
        <div class="cmd-palette">
          <div class="cmd-palette-header px-3 py-2 border-bottom d-flex align-items-center">
            <i class="bi bi-terminal text-primary me-2"></i>
            <span class="small fw-bold text-secondary">COMANDOS DSA</span>
          </div>
          <input type="text" class="cmd-palette-input" placeholder="¿Qué deseas hacer?" id="cmd-input">
          <div class="cmd-palette-results" id="cmd-results"></div>
          <div class="cmd-palette-footer p-2 border-top bg-light small text-secondary d-flex justify-content-center gap-3" style="font-size: 0.6rem;">
            <span><kbd>↵</kbd> Ejecutar</span>
            <span><kbd>↑↓</kbd> Navegar</span>
            <span><kbd>ESC</kbd> Cerrar</span>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      
      const input = document.getElementById('cmd-input');
      input.addEventListener('input', (e) => _filterCommands(e.target.value));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const first = document.querySelector('.cmd-item.selected') || document.querySelector('.cmd-item');
          if (first) first.click();
        }
      });
      
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) _toggleCommandPalette();
      });
    }

    const isHidden = overlay.classList.contains('d-none');
    if (isHidden) {
      overlay.classList.remove('d-none');
      const input = document.getElementById('cmd-input');
      input.value = '';
      input.focus();
      _filterCommands('');
    } else {
      overlay.classList.add('d-none');
    }
  }

  function _filterCommands(query) {
    const results = document.getElementById('cmd-results');
    const filtered = _commands.filter(c => c.label.toLowerCase().includes(query.toLowerCase()));
    
    results.innerHTML = filtered.map((c, idx) => `
      <div class="cmd-item ${idx === 0 ? 'selected' : ''}" onclick="DSA_App._executeCommand(${_commands.indexOf(c)})">
        <div class="d-flex align-items-center gap-3">
          <div class="cmd-icon-box bg-primary-subtle text-primary rounded-2 d-flex align-items-center justify-content-center" style="width: 28px; height: 28px;">
            <i class="${c.icon}"></i>
          </div>
          <div class="d-flex flex-column">
            <span class="fw-medium">${c.label}</span>
            <span class="text-secondary" style="font-size: 0.65rem;">${c.category}</span>
          </div>
        </div>
        <span class="cmd-shortcut">${c.shortcut}</span>
      </div>
    `).join('');
  }

  function _executeCommand(idx) {
    _toggleCommandPalette();
    _commands[idx].action();
  }

  /**
   * Retrasa la ejecución de una función hasta que haya una pausa.
   */
  function _debounce(fn, delay) {
    let timer;
    return function(...args) {
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(this, args), delay);
    };
  }

  /**
   * Controla la visibilidad y el estado del loader global institucional.
   * @param {boolean} show - Si true, muestra el loader.
   * @param {string} [message="Procesando..."] - Mensaje principal.
   * @param {string} [submessage=""] - Mensaje secundario detallado.
   * @public
   */
  function toggleTheme() {
    AppState.isDark = !AppState.isDark;
  }

  function toggleSidebar() {
    AppState.isSidebarCollapsed = !AppState.isSidebarCollapsed;
  }

  function toggleLoading(show, message = "Procesando...", submessage = "") {
    const loader = document.getElementById('global-loader');
    if (!loader) return;

    if (show) {
      loader.classList.remove('d-none');
      // Forzar reflow para animación
      void loader.offsetWidth;
      loader.style.opacity = '1';
      loader.style.visibility = 'visible';
    } else {
      loader.style.opacity = '0';
      loader.style.visibility = 'hidden';
      setTimeout(() => {
        if (loader.style.opacity === '0') loader.classList.add('d-none');
      }, TIMING.TRANSITION);
    }

    const msgEl = document.getElementById('loader-message');
    const subMsgEl = document.getElementById('loader-submessage');
    const progressBar = document.getElementById('loader-progress');
    
    if (msgEl) msgEl.innerText = message;
    if (subMsgEl) subMsgEl.innerText = submessage;
    
    if (!show && progressBar) {
      setTimeout(() => {
        progressBar.style.width = '0%';
        progressBar.classList.remove('processing');
      }, 400);
    }
  }

  /**
   * Muestra una notificación tipo Toast con estética Apple y feedback semántico.
   * @param {string} title - Título de la notificación.
   * @param {string} message - Cuerpo del mensaje.
   * @param {string} [type='info'] - Tipo semántico (success, danger, warning, info).
   * @public
   */
  function showToast(title, message, type = 'info') {
    const toastContainer = document.getElementById('toast-container');
    if (!toastContainer) return;
    
    const id = 'toast-' + Date.now();
    
    // Offset automático por posición en stack (UX Elite)
    const existing = toastContainer.querySelectorAll('[id^="toast-"]');
    const offset = existing.length * 12; // 12px de offset por toast existente

    // Mapeo de colores y iconos Apple
    const config = {
      'success': { color: '#34c759', icon: 'bi-check-circle-fill' },
      'danger': { color: '#ff3b30', icon: 'bi-exclamation-octagon-fill' },
      'warning': { color: '#ff9500', icon: 'bi-exclamation-triangle-fill' },
      'info': { color: '#007aff', icon: 'bi-info-circle-fill' }
    };
    
    const { color, icon } = config[type] || config.info;
    
    const html = `
      <div id="${id}" class="mb-3 dsa-toast" style="border-left-color: ${color}; transform: translateY(${offset}px);">
        <div class="p-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <div class="d-flex align-items-center gap-2">
              <i class="bi ${icon}" style="color: ${color};"></i>
              <span class="fw-bold small" style="color: ${color}; letter-spacing: 0.5px;">${title.toUpperCase()}</span>
            </div>
            <button type="button" class="btn-close small" style="font-size: 0.7rem; opacity: 0.5;" onclick="document.getElementById('${id}').remove()"></button>
          </div>
          <div class="text-secondary small" style="line-height: 1.4;">${message}</div>
        </div>
      </div>
    `;
    
    toastContainer.insertAdjacentHTML('beforeend', html);

    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) {
        el.classList.add('toast-exit');
        setTimeout(() => el.remove(), 300);
      }
    }, TIMING.TOAST);
  }


  /**
   * Detecta el Sistema Operativo para ajustar los atajos de teclado (UX).
   */
  /**
   * Detecta el Sistema Operativo para ajustar los atajos de teclado (UX).
   * @private
   */
  function _detectarOS() {
    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
    if (!isMac) {
      document.querySelectorAll('.dsa-kbd').forEach(el => {
        el.innerText = 'Ctrl+K';
      });
    }
  }

  // --- API PÚBLICA (Exposición controlada - Tarea #2) ---
  return {
    init,
    cambiarVista,
    toggleTheme,
    toggleSidebar,
    seleccionarChip,
    aplicarFiltrosBiblioteca,
    limpiarFiltrosYBuscar,
    cargarSiguientePagina,
    cerrarDetalle,
    mostrarDetalleOficio,
    abrirPanelRespuesta,
    cerrarPanelRespuesta,
    ejecutarGeneracion,
    registrarOficioFinal,
    cambiarPaso,
    validarYContinuar,
    _executeCommand
  };
})();

// Punto de entrada único con protección contra estados de carga
(function() {
  function _main() {
    if (typeof window.DSA_App !== 'undefined' && window.DSA_App.init) {
      window.DSA_App.init();
      console.log("DSA_App: Inicialización completada.");
    } else {
      console.error("DSA_App: Fallo crítico al inicializar el objeto global.");
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _main);
  } else {
    _main();
  }
})();
