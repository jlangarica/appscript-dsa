<script>
  /**
   * División de Servicios Administrativos (DSA) - Frontend Logic
   * @author Antigravity AI
   */

  // --- CAPA DE ESTADO (Reactive Proxy) ---
  const AppState = new Proxy({
    vistaActual: 'v-dashboard',
    pasoActual: 1,
    extractedData: null,
    bibliotecaData: [],
    bibliotecaOffset: 0,
    bibliotecaFiltros: null,
    uploadId: null,
    oficioParaRespuesta: null,
    isProcessing: false,
    isDark: localStorage.getItem('dsa-theme') === 'dark'
  }, {
    set(target, prop, value) {
      const old = target[prop];
      target[prop] = value;
      // Si el valor cambió, dispara la actualización de la UI
      if (old !== value) _onStateChange(prop, value);
      return true;
    }
  });

  /**
   * Manejador centralizado de cambios de estado (Reactividad)
   */
  function _onStateChange(prop, value) {
    if (prop === 'isDark') {
      document.documentElement.setAttribute('data-theme', value ? 'dark' : 'light');
      localStorage.setItem('dsa-theme', value ? 'dark' : 'light');
    }
    
    if (prop === 'isProcessing') {
      // Bloquea los botones principales para evitar doble envío
      document.querySelectorAll('.btn-primary, .btn-success, #pdf-input').forEach(el => el.disabled = value);
      
      // Si es un dropzone, añadir clase visual
      const dropzone = document.getElementById('dropzone');
      if (dropzone) dropzone.style.opacity = value ? '0.5' : '1';
    }

    if (prop === 'vistaActual') {
      _actualizarNavegacion(value);
    }
  }

  function _actualizarNavegacion(idVista) {
    document.querySelectorAll('.vista').forEach(v => v.classList.add('d-none'));
    const target = document.getElementById(idVista);
    if (target) {
      target.classList.remove('d-none');
      
      // Actualizar sidebar active state
      document.querySelectorAll('.mac-nav-link').forEach(link => {
        link.classList.remove('active');
        if (link.getAttribute('onclick')?.includes(idVista)) {
          link.classList.add('active');
        }
      });
    }
  }


  // --- INICIALIZACIÓN ---
  document.addEventListener('DOMContentLoaded', () => {
    cambiarVista('v-dashboard');
    initDragAndDrop();
    
    // Aplicar tema inicial
    if (AppState.isDark) document.documentElement.setAttribute('data-theme', 'dark');

    // Cargar datos iniciales
    cargarEstadisticasInicio();

    // Escuchar búsqueda en biblioteca
    const searchInput = document.getElementById('filtro-texto');
    if (searchInput) {
      searchInput.addEventListener('input', _debounce(() => aplicarFiltrosBiblioteca(), 300));
    }

    // Auto-resize textareas
    document.querySelectorAll('textarea.mac-input').forEach(el => {
      el.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
      });
    });
  });


  // --- ENRUTADOR ---
  function cambiarVista(idVista) {
    AppState.vistaActual = idVista;
    if (idVista === 'v-archivo') cargarBiblioteca();
    if (idVista === 'v-dashboard') cargarEstadisticasInicio();
  }

  // --- NAVEGACIÓN DEL WIZARD (Pasos) ---
  function cambiarPaso(numeroPaso) {
    document.querySelectorAll('.paso').forEach(p => p.classList.add('d-none'));
    const target = document.getElementById(`paso-${numeroPaso}`);
    if (target) {
      target.classList.remove('d-none');
      AppState.pasoActual = numeroPaso;
      
      // Actualizar Stepper UI
      document.querySelectorAll('.step-item').forEach((item, idx) => {
        const stepNum = idx + 1;
        item.classList.remove('active', 'completed');
        if (stepNum === numeroPaso) {
          item.classList.add('active');
        } else if (stepNum < numeroPaso) {
          item.classList.add('completed');
        }
      });

      // Si es el paso 3, actualizar resumen
      if (numeroPaso === 3) {
        document.getElementById('res-titular').innerText = document.getElementById('campo-titular').value || 'N/A';
        document.getElementById('res-area').innerText = document.getElementById('campo-area').value || 'N/A';
        document.getElementById('res-oficio').innerText = document.getElementById('campo-oficio').value || 'N/A';
        document.getElementById('res-tipo-doc').innerText = document.getElementById('campo-tipo-doc').value || 'N/A';
        document.getElementById('res-urgencia').innerText = document.getElementById('campo-urgencia').value || 'Normal';
        document.getElementById('res-requiere-respuesta').innerText = document.getElementById('campo-requiere-respuesta').checked ? 'SÍ' : 'NO';
      }
    }
  }

  // --- GESTOR DE DOCUMENTOS ---
  function initDragAndDrop() {
    const dropzone = document.getElementById('dropzone');
    const input = document.getElementById('pdf-input');

    if (!dropzone) return;

    dropzone.addEventListener('click', () => input.click());
    
    input.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, e => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.style.borderColor = 'var(--system-blue)';
        dropzone.style.background = 'rgba(0, 122, 255, 0.05)';
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, e => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.style.borderColor = '';
        dropzone.style.background = '';
      }, false);
    });

    dropzone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const file = dt.files[0];
      if (file && file.type === 'application/pdf') {
        handleFile(file);
      } else {
        showToast('Error', 'Por favor selecciona un archivo PDF.', 'danger');
      }
    });
  }

  function handleFile(file) {
    // Validación de Tamaño (10MB límite para evitar errores de payload en GAS)
    const MAX_SIZE = 10 * 1024 * 1024; // 10MB
    if (file.size > MAX_SIZE) {
      showToast('Archivo demasiado grande', 'El PDF supera los 10MB. Por favor optimiza el archivo antes de subirlo.', 'warning');
      return;
    }

    AppState.pdfFile = file;
    AppState.uploadId = 'up_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    
    // Render PDF localmente
    const objectUrl = URL.createObjectURL(file);
    document.getElementById('pdf-viewer').src = objectUrl;

    // Convertir a Base64 para GAS
    const reader = new FileReader();
    reader.onload = function(e) {
      AppState.pdfBase64 = e.target.result.split(',')[1];
      procesarDocumento();
    };
    reader.readAsDataURL(file);
  }

  function procesarDocumento() {
    AppState.isProcessing = true;
    
    // Rotar mensajes de carga (UX de Procesamiento Oficial)
    const messages = [
      'Analizando estructura del documento...',
      'Extrayendo metadatos oficiales...',
      'Validando integridad de la información...',
      'Organizando datos para revisión...'
    ];
    let msgIdx = 0;
    let progress = 0;
    
    const msgInterval = setInterval(() => {
      msgIdx = (msgIdx + 1) % messages.length;
      const subMessage = document.getElementById('loader-submessage');
      if (subMessage) subMessage.textContent = messages[msgIdx];
      
      // Incrementar progreso simulado (más lento al final)
      if (progress < 90) {
        progress += Math.random() * 15;
        const progressBar = document.getElementById('loader-progress');
        if (progress >= 90) {
          progress = 90;
          if (progressBar) progressBar.classList.add('processing');
        }
        if (progressBar) progressBar.style.width = progress + '%';
      }
    }, 3000);

    toggleLoading(true, "Procesando...", messages[0]);

    // Temporizador de seguridad extendido (90 segundos)
    const timeoutId = setTimeout(() => {
      if (AppState.isProcessing) {
        AppState.isProcessing = false;
        clearInterval(msgInterval);
        toggleLoading(false);
        showToast('Timeout', 'La operación tardó demasiado. Intenta con un archivo más ligero.', 'danger');
      }
    }, 90000);

    google.script.run
      .withSuccessHandler(response => {
        clearTimeout(timeoutId);
        clearInterval(msgInterval);
        
        if (response && response.success) {
          AppState.extractedData = response.data;
          poblarFormulario(response.data);
          cambiarPaso(2);
          const progressBar = document.getElementById('loader-progress');
          if (progressBar) progressBar.style.width = '100%';
          showToast('Éxito', 'Información procesada correctamente.', 'success');
        } else {
          const msg = response ? response.message : "Error desconocido en el servidor";
          showToast('Error', msg, 'danger');
        }
        AppState.isProcessing = false;
        toggleLoading(false);
      })
      .withFailureHandler(err => {
        clearTimeout(timeoutId);
        clearInterval(msgInterval);
        showToast('Error de Servidor', err.message, 'danger');
        AppState.isProcessing = false;
        toggleLoading(false);
      })
      .procesarDocumento(AppState.pdfBase64, AppState.pdfFile.name);
  }

  function poblarFormulario(data) {
    document.getElementById('campo-titular').value = _escaparHTML(data.titular) || '';
    document.getElementById('campo-area').value = _escaparHTML(data.area) || '';
    document.getElementById('campo-oficio').value = _escaparHTML(data.oficio) || '';
    document.getElementById('campo-asunto').value = _escaparHTML(data.asunto) || '';
    document.getElementById('campo-tipo-doc').value = data.tipo_doc || 'Informativo';
    document.getElementById('campo-urgencia').value = data.urgencia || 'Normal';
    document.getElementById('campo-requiere-respuesta').checked = !!data.requiere_respuesta;
    
    // Disparar auto-resize para textareas poblados
    setTimeout(() => {
      document.querySelectorAll('textarea.mac-input').forEach(el => {
        el.dispatchEvent(new Event('input'));
      });
    }, 100);
  }

  // --- CONFIRMACIÓN FINAL ---
  function registrarOficioFinal() {
    const data = {
      titular: document.getElementById('campo-titular').value,
      area: document.getElementById('campo-area').value,
      oficio: document.getElementById('campo-oficio').value,
      asunto: document.getElementById('campo-asunto').value,
      tipo_doc: document.getElementById('campo-tipo-doc').value,
      urgencia: document.getElementById('campo-urgencia').value,
      requiere_respuesta: document.getElementById('campo-requiere-respuesta').checked,
      fileName: AppState.pdfFile.name,
      uploadId: AppState.uploadId
    };

    toggleLoading(true, "Registrando en la Oficialía...");

    // Temporizador de seguridad (60 segundos)
    const timeoutId = setTimeout(() => {
      toggleLoading(false);
      showToast('Timeout', 'El registro está tardando. Verifica tu conexión o el estado de la hoja.', 'warning');
    }, 60000);

    google.script.run
      .withSuccessHandler(res => {
        clearTimeout(timeoutId);
        if (res && res.success) {
          showToast('Registrado', res.message, 'success');
          AppState.uploadId = null; // Limpiar ID tras éxito
          resetForm();
          cambiarVista('v-dashboard');
        } else {
          const msg = res ? res.message : "Error al registrar el oficio";
          showToast('Error', msg, 'danger');
        }
        toggleLoading(false);
      })
      .withFailureHandler(err => {
        clearTimeout(timeoutId);
        showToast('Error', err.message, 'danger');
        toggleLoading(false);
      })
      .registrarOficioFinalizado(data, AppState.pdfBase64, AppState.pdfFile.name);
  }

  function resetForm() {
    AppState.pasoActual = 1;
    AppState.pdfFile = null;
    AppState.pdfBase64 = null;
    AppState.extractedData = null;
    document.getElementById('form-datos').reset();
    document.getElementById('pdf-viewer').src = 'about:blank';
    cambiarPaso(1);
  }

  // --- GESTOR DE INICIO (DASHBOARD) ---

  function cargarEstadisticasInicio() {
    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success) {
          const d = res.data;
          document.getElementById('stat-total').innerText = d.total || 0;
          document.getElementById('stat-pendientes').innerText = d.pendientes || 0;
          document.getElementById('stat-urgentes').innerText = d.urgentes || 0;
          document.getElementById('stat-hoy').innerText = d.registradosHoy || 0;
          
          _renderizarRecientes(d.recientes);
        } else {
          console.error("Error al cargar estadísticas (Response):", res);
        }
      })
      .withFailureHandler(err => {
        console.error("Error de red/GAS en cargarEstadisticasInicio:", err);
      })
      .obtenerEstadisticas();
  }

  function _renderizarRecientes(recientes) {
    const tbody = document.getElementById('tabla-recientes-body');
    if (!tbody) return;

    if (!recientes || recientes.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-secondary">No hay actividad reciente.</td></tr>';
      return;
    }

    const html = recientes.map(r => `
      <tr>
        <td class="ps-4 fw-medium">${r.folio}</td>
        <td class="small">${_escaparHTML(r.titular)}</td>
        <td class="small text-secondary text-truncate" style="max-width: 150px;">${_escaparHTML(r.asunto)}</td>
        <td class="small text-secondary">${r.fecha}</td>
        <td class="pe-4"><span class="badge rounded-pill bg-success-subtle text-success px-3">${r.estatus}</span></td>
      </tr>
    `).join('');

    tbody.innerHTML = html;
  }

  // --- GESTOR DE RESPUESTAS ---

  function abrirPanelRespuesta(index) {
    const oficio = AppState.bibliotecaData[index];
    if (!oficio) return;
    
    AppState.oficioParaRespuesta = oficio;
    
    document.getElementById('resp-oficio-ref').innerText = oficio.oficio;
    document.getElementById('resp-titular').value = oficio.titular;
    document.getElementById('resp-area-val').value = oficio.area;
    document.getElementById('resp-oficio-val').value = oficio.oficio;
    document.getElementById('resp-asunto-val').value = oficio.asunto;
    document.getElementById('resp-notas').value = '';
    
    const panel = document.getElementById('panel-respuesta');
    const overlay = document.getElementById('panel-overlay');
    panel.classList.remove('d-none');
    overlay.classList.remove('d-none');
    setTimeout(() => {
      panel.style.transform = 'translateX(0)';
      overlay.style.opacity = '1';
    }, 10);
  }

  function cerrarPanelRespuesta() {
    const panel = document.getElementById('panel-respuesta');
    const overlay = document.getElementById('panel-overlay');
    panel.style.transform = 'translateX(100%)';
    overlay.style.opacity = '0';
    setTimeout(() => {
      panel.classList.add('d-none');
      overlay.classList.add('d-none');
    }, 400);
  }

  function ejecutarGeneracion(asistido) {
    const notas = document.getElementById('resp-notas').value;
    if (!notas.trim()) {
      showToast('Atención', 'Por favor escribe los puntos clave para la respuesta.', 'warning');
      return;
    }

    const payload = {
      titular: document.getElementById('resp-titular').value,
      area: document.getElementById('resp-area-val').value,
      oficio: document.getElementById('resp-oficio-val').value,
      asunto: document.getElementById('resp-asunto-val').value,
      notasUsuario: notas,
      asistido: asistido
    };

    toggleLoading(true, asistido ? "Generando redacción profesional..." : "Generando borrador...");

    google.script.run
      .withSuccessHandler(res => {
        console.log("Servidor respondió:", res);
        toggleLoading(false);
        try {
          if (res && res.success) {
            showToast('Éxito', 'Documento generado y registrado correctamente.', 'success');
            cerrarPanelRespuesta();
            // Abrir en nueva pestaña si es posible
            if (res.url) {
              const win = window.open(res.url, '_blank');
              if (!win) showToast('Aviso', 'El documento se creó, pero el navegador bloqueó la ventana emergente.', 'warning');
            }
          } else {
            const msg = res ? res.message : "Respuesta vacía del servidor";
            showToast('Error de Generación', msg, 'danger');
            alert("Error al generar: " + msg); // Alerta de respaldo si el toast falla
          }
        } catch (e) {
          console.error("Error en success handler:", e);
          showToast('Error', 'Fallo al procesar respuesta del servidor.', 'danger');
        }
      })
      .withFailureHandler(err => {
        toggleLoading(false);
        console.error("Fallo crítico en EjecutarGeneracion:", err);
        const msg = err ? err.message : "Error desconocido de red";
        showToast('Error Crítico', msg, 'danger');
        alert("Fallo crítico: " + msg);
      })
      .generarRespuestaOficio(payload);
  }

  // --- GESTOR DE BIBLIOTECA ---

  function cargarBiblioteca(append = false) {
    if (!append) {
      AppState.bibliotecaOffset = 0;
      AppState.bibliotecaData = [];
      
      // Mostrar esqueletos mientras carga
      const tbody = document.getElementById('tabla-biblioteca-body');
      if (tbody) {
        tbody.innerHTML = Array(6).fill(`
          <tr>
            <td class="ps-4"><div class="skeleton-box" style="width: 70px;"></div></td>
            <td><div class="cell-group"><div class="skeleton-box" style="width: 140px;"></div><div class="skeleton-box" style="width: 100px;"></div></div></td>
            <td><div class="cell-group"><div class="skeleton-box" style="width: 100px;"></div><div class="skeleton-box" style="width: 60px;"></div></div></td>
            <td><div class="skeleton-box" style="width: 180px;"></div></td>
            <td><div class="skeleton-box" style="width: 80px; border-radius: 20px;"></div></td>
            <td class="text-center"><div class="skeleton-box" style="width: 24px;"></div></td>
            <td class="text-center"><div class="skeleton-box" style="width: 24px;"></div></td>
          </tr>
        `).join('');
      }
    }

    google.script.run
      .withSuccessHandler(res => {
        toggleLoading(false);
        if (res && res.success) {
          if (append) {
            AppState.bibliotecaData = [...AppState.bibliotecaData, ...res.data];
          } else {
            AppState.bibliotecaData = res.data;
          }
          
          _poblarFiltroAreas(AppState.bibliotecaData);
          renderizarTablaBiblioteca(AppState.bibliotecaData);
          
          // Gestionar botón de cargar más
          const btnLoadMore = document.getElementById('btn-cargar-mas');
          if (btnLoadMore) {
            btnLoadMore.classList.toggle('d-none', !res.hasMore);
          }
        } else {
          const msg = res ? res.message : "Error al cargar los datos";
          showToast('Error', msg, 'danger');
        }
      })
      .withFailureHandler(err => {
        toggleLoading(false);
        console.error("Error de red/GAS en cargarBiblioteca:", err);
        showToast('Error de Servidor', err.message, 'danger');
      })
      .obtenerRegistros(AppState.bibliotecaOffset, 50, AppState.bibliotecaFiltros);
  }

  function cargarSiguientePagina() {
    AppState.bibliotecaOffset += 50;
    cargarBiblioteca(true);
  }

  function _poblarFiltroAreas(data) {
    const areas = [...new Set(data.map(r => r.area).filter(a => a))].sort();
    const select = document.getElementById('filtro-area');
    if (!select) return;
    
    select.innerHTML = '<option value="">Todas las Áreas</option>';
    areas.forEach(area => {
      select.insertAdjacentHTML('beforeend', `<option value="${area}">${area}</option>`);
    });
  }

  function aplicarFiltrosBiblioteca() {
    const filtrados = {
      texto: document.getElementById('filtro-texto').value,
      area: document.getElementById('filtro-area').value,
      tipo: document.getElementById('filtro-tipo').value,
      prioridad: document.getElementById('filtro-prioridad').value,
      respuesta: document.getElementById('filtro-respuesta').value
    };

    AppState.bibliotecaFiltros = filtrados;
    cargarBiblioteca(false);
  }

  function renderizarTablaBiblioteca(data) {
    const tbody = document.getElementById('tabla-biblioteca-body');
    if (!tbody) return;

    if (data.length === 0) {
      tbody.innerHTML = '';
      return;
    }

    const html = data.map(reg => {
      const colorPrioridad = {
        'Baja': 'secondary',
        'Normal': 'primary',
        'Alta': 'warning',
        'Crítica': 'danger'
      }[reg.urgencia] || 'primary';

      const btnDoc = reg.url 
        ? `<a href="${reg.url}" target="_blank" class="btn btn-sm btn-link p-0 text-primary" title="Ver Documento">
             <i class="bi bi-file-earmark-pdf" style="font-size: 1.2rem;"></i>
           </a>`
        : `<button class="btn btn-sm btn-link p-0 text-secondary opacity-50" disabled title="Documento no disponible">
             <i class="bi bi-file-earmark-pdf" style="font-size: 1.2rem;"></i>
           </button>`;

      return `
        <tr>
          <td class="ps-4 small text-secondary">${reg.fecha}</td>
          <td>
            <div class="cell-group">
              <div class="fw-medium text-truncate" style="max-width: 180px;">${_escaparHTML(reg.titular)}</div>
              <div class="small text-secondary text-truncate" style="max-width: 180px;">${_escaparHTML(reg.area)}</div>
            </div>
          </td>
          <td>
            <div class="cell-group">
              <div class="small font-monospace">${_escaparHTML(reg.oficio)}</div>
              <div><span class="badge bg-light text-dark border" style="font-size: 0.65rem;">${reg.tipo_doc}</span></div>
            </div>
          </td>
          <td class="small text-truncate" style="max-width: 200px;">${_escaparHTML(reg.asunto)}</td>
          <td><span class="badge bg-${colorPrioridad}-subtle text-${colorPrioridad} rounded-pill px-3">${reg.urgencia}</span></td>
          <td class="pe-4 text-center">${btnDoc}</td>
          <td class="pe-4 text-center">
            <button class="btn btn-sm btn-link p-0 text-success" onclick="abrirPanelRespuesta(${data.indexOf(reg)})" title="Responder">
              <i class="bi bi-reply-fill" style="font-size: 1.2rem;"></i>
            </button>
          </td>
        </tr>
      `;
    }).join('');

    tbody.innerHTML = html;
  }

  // --- UTILIDADES ---
  
  /**
   * Escapa HTML nativo para evitar XSS.
   */
  function _escaparHTML(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  /**
   * Retrasa la ejecución de una función hasta que haya una pausa.
   */
  function _debounce(fn, delay) {
    let timer;
    return function(...args) {
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(this, args), delay);
    };
  }

  function toggleTheme() {
    AppState.isDark = !AppState.isDark;
  }

  function toggleLoading(show, message = "Procesando...", submessage = "") {
    const loader = document.getElementById('global-loader');
    if (loader) {
      loader.classList.toggle('d-none', !show);
      const msgEl = document.getElementById('loader-message');
      const subMsgEl = document.getElementById('loader-submessage');
      const progressBar = document.getElementById('loader-progress');
      
      if (msgEl) msgEl.innerText = message;
      if (subMsgEl) subMsgEl.innerText = submessage;
      if (!show && progressBar) {
        progressBar.style.width = '0%';
        progressBar.classList.remove('processing');
      }
    }
  }

  function showToast(title, message, type = 'info') {
    const toastContainer = document.getElementById('toast-container');
    const id = 'toast-' + Date.now();
    
    // Mapeo de colores Apple
    const colors = {
      'success': '#34c759',
      'danger': '#ff3b30',
      'warning': '#ff9500',
      'info': '#007aff'
    };
    
    const color = colors[type] || colors.info;
    
    const html = `
      <div id="${id}" class="mac-card mb-3 shadow-lg" style="width: 320px; border-left: 4px solid ${color}; animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1);">
        <div class="p-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="fw-bold small" style="color: ${color}">${title.toUpperCase()}</span>
            <button type="button" class="btn-close small" style="font-size: 0.7rem" onclick="document.getElementById('${id}').remove()"></button>
          </div>
          <div class="text-secondary small">${message}</div>
        </div>
      </div>
    `;
    
    toastContainer.insertAdjacentHTML('beforeend', html);

    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) {
        el.classList.add('toast-exit');
        setTimeout(() => el.remove(), 300);
      }
    }, 5000);
  }
</script>
